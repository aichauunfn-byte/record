<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>隨手記帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#0b0b0b; --card:#161616; --card2:#202221; --line:#2d2f2e;
  --text:#f1f1f1; --muted:#9a9d9b; --accent:#0e4a40; --accent-line:#2f7f70;
  --danger:#e5655b; --ok:#5cc9a7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px}
h1{font-size:24px;margin:0}
.who{font-size:13px;color:var(--muted);margin-top:2px}
.who b{color:var(--text);font-weight:600}
.iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:8px 12px;font-size:15px}
.month{display:flex;align-items:center;justify-content:center;gap:20px;margin:4px 0 12px;font-size:18px}
.month button{background:none;border:0;color:var(--text);font-size:26px;padding:4px 12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.summary div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.summary small{display:block;color:var(--muted);font-size:12px}
.summary b{font-size:17px}
.exp{color:var(--danger)} .inc{color:var(--ok)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px}
.panel h2{font-size:22px;margin:0 0 12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#101110;border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{background:none;border:0;color:var(--muted);font-size:17px;padding:12px 0;border-radius:11px}
.tabs button.on{background:var(--card2);color:var(--text);font-weight:700}
.voice{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:14px;padding:16px;font-size:18px;font-weight:600}
.voice.listening{border-color:var(--danger);color:var(--danger)}
.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:8px 0 0}
label{display:block;color:var(--muted);font-size:16px;margin:18px 0 8px}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);
  border-radius:14px;padding:14px;font-size:18px;font-family:inherit}
input[type=number]{font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line);
  color:var(--text);border-radius:999px;padding:10px 16px;font-size:17px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip.on{background:var(--accent);border-color:var(--accent-line);font-weight:700;box-shadow:0 0 0 3px rgba(47,127,112,.35)}
.chip.on::before{content:"✓"}
.save{width:100%;margin-top:22px;background:var(--accent);border:1px solid var(--accent-line);color:#fff;
  border-radius:16px;padding:16px;font-size:19px;font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{margin-top:20px}
.list h3{font-size:16px;color:var(--muted);margin:0 0 8px;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.item .l{min-width:0}
.item .t{font-weight:600}
.item .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;white-space:nowrap}
.item .r small{display:block;font-size:12px;color:var(--muted)}
.item button{background:none;border:0;color:var(--muted);font-size:20px;padding:4px 8px}
.dot{color:var(--muted)} .dot.pending{color:#e0b341}.dot.done{color:var(--ok)}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:20px;
  width:min(94vw,520px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{margin:0 0 4px;font-size:20px}
dialog input,dialog textarea{font-size:16px}
dialog .btns{display:flex;gap:10px;margin-top:16px}
dialog .btns button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);
  background:var(--card2);color:var(--text);font-size:16px}
dialog .btns .primary{background:var(--accent);border-color:var(--accent-line);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#2a2c2b;border:1px solid var(--line);padding:12px 18px;border-radius:999px;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.hidden{display:none!important}

body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.month{margin:4px 0 10px}
.summary b{font-size:15px;white-space:nowrap}
.summary.one{grid-template-columns:1fr}
.panel{margin-top:16px}
.tabs button{font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.card h3{margin:0 0 8px;font-size:16px;color:var(--muted);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px;font-size:15px;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent-line);font-weight:700}
.btn.danger,.danger{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:11px 14px;font-size:15px;width:100%;margin-top:12px}
.btn.sm{width:auto;margin:0;padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4}
.plain{width:100%;margin-top:10px;background:none;border:0;color:var(--muted);padding:10px;font-size:15px}
.hint.warn{color:#e0b341}
.hint.center{text-align:center;margin-top:18px}
.err{color:var(--danger);font-size:14px;margin:10px 0 0;min-height:0}
.filt{margin:0 0 10px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.filt .chip{white-space:nowrap;padding:7px 13px;font-size:14px;flex:none}
.dayh{color:var(--muted);font-size:13px;margin:12px 2px 6px}
.item{cursor:pointer}
.tag{display:inline-block;margin-left:8px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-weight:400}
.rem{border-top:1px solid var(--line);padding:10px 0}
.rem:first-of-type{border-top:0}
.rem .s{color:var(--muted);font-size:13px;margin-top:2px}
.rem .btn{margin-top:8px}
.chk{display:flex;align-items:center;gap:10px;color:var(--text);margin:16px 0 4px}
.chk input{width:22px;height:22px;flex:none}
.fold{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--text);font:inherit;padding:0;text-align:left}
.fold .arrow{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:99px;background:#101110;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.catrow{display:block;width:100%;background:none;border:0;color:var(--text);font:inherit;text-align:left;padding:8px 0}
.cr1{display:flex;justify-content:space-between;margin-bottom:5px;font-size:15px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.sub{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding:6px 0 6px 16px;border-bottom:1px solid var(--line)}
.trend{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:5px 0}
.trend .tl{color:var(--muted);font-size:13px}
.trend .tb{display:grid;gap:3px}
.trend .tn{font-size:12px;text-align:right;display:grid}
.stack{display:flex;height:100%}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin:10px 0}
.item .r a{color:var(--accent-line)}
#nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#111211;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
#nav button{background:none;border:0;color:var(--muted);font-size:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
#nav button b{font-size:20px;font-weight:400}
#nav button.on{color:#fff}
#nav button.on b{filter:none}
dialog{max-height:90vh;overflow:auto}
dialog .tabs{margin-top:10px}
dialog .save{margin-top:18px}
dialog .btns{position:sticky;bottom:-18px;background:var(--card);padding-top:8px}
dialog select,dialog input[type=date]{font-size:16px}
select{appearance:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>隨手記帳</h1>
      <div class="who" id="whoLabel"></div>
    </div>
    <button class="iconbtn" id="syncBtn">☁ 同步</button>
  </header>
  <main id="view"></main>
</div>

<nav id="nav">
  <button data-p="list" class="on"><b>📒</b>明細</button>
  <button data-p="acct"><b>💳</b>帳戶</button>
  <button data-p="plan"><b>🛡️</b>保單分期</button>
  <button data-p="stat"><b>📊</b>統計</button>
  <button data-p="info"><b>👤</b>基本資料</button>
</nav>

<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script src="app-core.js"></script>
<script src="app-pages.js"></script>
</body>
</html>
